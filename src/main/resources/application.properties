# Profil: heç n? t?yin olunmay?bsa lokal i?l?sin
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/naxbuilding}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Google
app.oauth2.google.client-id=661875256060-o8o8m05hu4oduvtga8rckhdbb28vdftt.apps.googleusercontent.com
app.google.maps.api-key=${GOOGLE_MAPS_API_KEY:}

# Upload
app.upload.dir=${UPLOAD_DIR:uploads}

# CORS v? cookie
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174}
app.cookie.secure=${COOKIE_SECURE:false}
app.cookie.same-site=Lax

# Dev
app.dev.log-emails=${LOG_EMAILS:false}

# Mail
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# Frontend
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# File upload
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# Nginx arxas?nda
server.forward-headers-strategy=framework